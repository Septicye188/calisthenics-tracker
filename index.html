  }

    border: none;

    border-radius: 4px;

    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(48,54,61,0.4);
  }
  .exercise:last-child { border-bottom: none; }
  .cb-wrap {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    position: relative;
    touch-action: manipulation;
  }
  .cb {
    width: 22px;
    height: 22px;
    border: 2px solid #58a6ff;
    border-radius: 5px;
    background: transparent;
    cursor: pointer;
    transition: all 0.12s;
    touch-action: manipulation;
    position: absolute;
    top: 0;
    left: 0;
  }
  .cb.checked {
    background: #3fb950;
    border-color: #3fb950;
  }
  .cb.checked::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 6px;
    width: 6px;
    height: 10px;
    border: solid #0d1117;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);

  .ex-name {

    color: #e6edf3;
    font-size: 0.88rem;
    line-height: 1.3;
  }
  .ex-detail {
    font-size: 0.75rem;
    color: #8b949e;
    margin-top: 2px;
    line-height: 1.35;
  }
  .ex-meta {
    color: #f0883e;
    font-size: 0.75rem;
    font-weight: 500;
    margin-left: 4px;
  }
  .footer-bar {

    bottom: 0;
    left: 0;
    right: 0;
    background: #161b22;
    border-top: 1px solid #21262d;
    padding: 10px 14px;

    align-items: center;
    justify-content: space-between;

  .progress-stat {

    color: #8b949e;
  }

  .reset-btn {

    font-weight: 500;

// ── State ──
const storageKey = 'calisthenics_tracker_v2';
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(storageKey);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { checked: {} };
}

function saveState() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch(e) {}
}

// Build unique key per exercise: dayId + sectionIndex + exerciseIndex
function exKey(dayId, secIdx, exIdx) {
  return dayId + ':' + secIdx + ':' + exIdx;
}

// ── Render ──
let currentDay = 'monday';

function renderDayTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = '';
  DAYS.forEach(day => {
    const btn = document.createElement('button');
    btn.className = 'day-tab';
    btn.textContent = day.label;
    btn.dataset.day = day.id;
    if (day.id === currentDay) btn.classList.add('active');
    // Check if all exercises in this day are checked
    let allDone = true;
    day.sections.forEach((sec, si) => {
      sec.exercises.forEach((ex, ei) => {
        if (!state.checked[exKey(day.id, si, ei)]) allDone = false;
      });
    });
    if (allDone) btn.classList.add('done');
    btn.addEventListener('click', () => {
      currentDay = day.id;
      renderDayTabs();
      renderDayContent();
      updateFooter();
      updateBanner();
    });
    container.appendChild(btn);
  });
}

function renderDayContent() {
  const container = document.getElementById('dayContent');
  const day = DAYS.find(d => d.id === currentDay);
  if (!day) return;
  container.innerHTML = '';
  day.sections.forEach((sec, si) => {
    const secEl = document.createElement('div');
    secEl.className = 'section';
    let html = '<div class="section-header">';
    html += '<span class="section-title">' + sec.title + '</span>';
    if (sec.hint) html += '<span class="section-hint">' + sec.hint + '</span>';
    html += '<button class="check-all-btn" data-sec="' + si + '">check all</button>';
    html += '</div>';
    sec.exercises.forEach((ex, ei) => {
      const key = exKey(day.id, si, ei);
      const checked = state.checked[key] ? 'checked' : '';
      html += '<div class="exercise">';
      html += '<div class="cb-wrap"><div class="cb ' + checked + '" data-key="' + key + '"></div></div>';
      html += '<div class="ex-content">';
      html += '<span class="ex-name">' + ex.name + '<span class="ex-meta">' + (ex.meta || '') + '</span></span>';
      html += '<div class="ex-detail">' + (ex.detail || '') + '</div>';
      html += '</div></div>';
    });
    secEl.innerHTML = html;
    container.appendChild(secEl);
  });
  // Attach check-all buttons
  container.querySelectorAll('.check-all-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const si = parseInt(e.target.dataset.sec);
      const day = DAYS.find(d => d.id === currentDay);
      day.sections[si].exercises.forEach((ex, ei) => {
        state.checked[exKey(currentDay, si, ei)] = true;
      });
      saveState();
      renderDayContent();
      renderDayTabs();
      updateFooter();
      updateBanner();
    });
  });
  // Attach checkbox clicks
  container.querySelectorAll('.cb').forEach(cb => {
    cb.addEventListener('click', (e) => {
      const key = e.target.dataset.key;
      state.checked[key] = !state.checked[key];
      saveState();
      e.target.classList.toggle('checked');
      renderDayTabs();
      updateFooter();
      updateBanner();
    });
  });
}

function updateFooter() {
  const total = document.querySelectorAll('.cb').length;
  const done = document.querySelectorAll('.cb.checked').length;
  document.getElementById('globalProgress').innerHTML = done + ' / ' + total + ' done';
}

function updateBanner() {
  const banner = document.getElementById('completionBanner');
  const day = DAYS.find(d => d.id === currentDay);
  let allDone = true;
  day.sections.forEach((sec, si) => {
    sec.exercises.forEach((ex, ei) => {
      if (!state.checked[exKey(currentDay, si, ei)]) allDone = false;
    });
  });
  if (allDone) {
    banner.textContent = '✅ ' + day.label.replace('•', '').trim() + ' — all done!';
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

function confirmReset() {
  if (!confirm('Reset all workout progress?')) return;
  state.checked = {};
  saveState();
  renderDayContent();
  renderDayTabs();
  updateFooter();
  updateBanner();
}

// ── Init ──
renderDayTabs();
renderDayContent();
updateFooter();
updateBanner();
</script>
